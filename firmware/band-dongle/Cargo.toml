[package]
name = "band-dongle"
version = "0.15.2"
edition = "2021"
description = "Meta Neural Band dongle: connects to the band with its owner key (band-core) and exposes it as system input"
license = "MIT"

[[bin]]
name = "band-dongle"
harness = false

[profile.release]
opt-level = "s"

# The session's P-256 key exchange and signatures are on the path to connecting the band: fast code
# there (about 3x), small code elsewhere. Not the hashes and AES, which run for every packet: the
# chip runs code from flash through a 16 KB cache, and their unrolled code missed it (a packet's
# HMAC and AES took 6 ms at opt-level 3, 0.7 ms compact).
[profile.release.package.p256]
opt-level = 3
[profile.release.package.primeorder]
opt-level = 3
[profile.release.package.elliptic-curve]
opt-level = 3
[profile.release.package.ecdsa]
opt-level = 3
[profile.release.package.crypto-bigint]
opt-level = 3
[profile.release.package.sha2]
opt-level = "s"
[profile.release.package.hmac]
opt-level = "s"
[profile.release.package.aes]
opt-level = "s"
[profile.release.package.band-core]
opt-level = 3

[profile.dev]
debug = true
opt-level = "z"

[dependencies]
log = "0.4"
anyhow = "1"
base64 = "0.22"
sha2 = { version = "0.10", features = ["force-soft-compact"] }
p256 = { version = "0.13", features = ["ecdsa"] }
rand_core = { version = "0.6", features = ["getrandom"] }
esp-idf-svc = { version = "0.53", features = ["embassy-time-driver", "critical-section"] }
embassy-time = { version = "0.5", features = ["generic-queue-8"] }
esp32-nimble = "0.13"
# air-gestures' band-core 4b59393, vendored with fixes for updated band firmware (see ../band-core/VENDORED.md).
band-core = { path = "../band-core" }
# The gesture profiles (PROFILES.md), shared with the app's test vectors.
np-profiles = { path = "../np-profiles" }

[build-dependencies]
embuild = "0.33"
