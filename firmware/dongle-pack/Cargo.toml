[package]
name = "dongle-pack"
version = "0.1.0"
edition = "2021"
description = "Signs bandit firmware into .banditfw update packages and writes the release index"
license = "MIT"

[dependencies]
p256 = { version = "0.13", features = ["ecdsa"] }
rand_core = { version = "0.6", features = ["getrandom"] }
sha2 = "0.10"
anyhow = "1"
base64 = "0.22"
