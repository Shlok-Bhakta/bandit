name: Bandit
options:
  bundleIdPrefix: io.github.shlok-bhakta
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/App.xcconfig
  Release: Config/App.xcconfig
packages:
  NeuralBandKit:
    path: NeuralBandKit
targets:
  # Bandit: the band remote dongle's own app (hosts, profiles, pairing, firmware).
  Bandit:
    type: application
    platform: iOS
    sources:
      - path: Bandit
      - path: BanditShared
    dependencies:
      - package: NeuralBandKit
        product: DongleProtocol
      - package: NeuralBandKit
        product: BandLogging
      - package: NeuralBandKit
        product: BandTransport
      - target: BanditWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.shlok-bhakta.bandit
        PRODUCT_NAME: Bandit
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Bandit/Info.plist
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
  # Its Live Activities (firmware update, dongle status), started and updated by the app.
  BanditWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: BanditWidgets
      - path: BanditShared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.shlok-bhakta.bandit.widgets
        PRODUCT_NAME: BanditWidgets
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: BanditWidgets/Info.plist
        APPLICATION_EXTENSION_API_ONLY: YES
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES
schemes:
  Bandit:
    build:
      targets:
        Bandit: all
        BanditWidgets: all
    run:
      config: Debug
    archive:
      config: Release
