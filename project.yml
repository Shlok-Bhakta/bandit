name: NeuralPlayground
options:
  bundleIdPrefix: dev.neuralplayground
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/App.xcconfig
  Release: Config/App.xcconfig
packages:
  NeuralBandKit:
    path: NeuralBandKit
targets:
  NeuralPlayground:
    type: application
    platform: iOS
    sources:
      - path: NeuralPlayground
    dependencies:
      - package: NeuralBandKit
        product: BandKit
      - package: NeuralBandKit
        product: BandProtocol
      - package: NeuralBandKit
        product: BandCredentials
      - package: NeuralBandKit
        product: BandTransport
      - package: NeuralBandKit
        product: BandLogging
      - package: NeuralBandKit
        product: BandAccessibility
    settings:
      base:
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: NeuralPlayground/Info.plist
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
  # NP Dongle: the band remote dongle's own app (hosts, profiles, pairing, firmware).
  NPDongle:
    type: application
    platform: iOS
    sources:
      - path: NPDongle
      - path: NPDongleShared
    dependencies:
      - package: NeuralBandKit
        product: DongleProtocol
      - package: NeuralBandKit
        product: BandLogging
      - package: NeuralBandKit
        product: BandTransport
      - target: NPDongleWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.neuralplayground.dongle
        PRODUCT_NAME: NPDongle
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: NPDongle/Info.plist
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
  # Its Live Activities (firmware update, dongle status), started and updated by the app.
  NPDongleWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: NPDongleWidgets
      - path: NPDongleShared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.neuralplayground.dongle.widgets
        PRODUCT_NAME: NPDongleWidgets
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: NPDongleWidgets/Info.plist
        APPLICATION_EXTENSION_API_ONLY: YES
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES
schemes:
  NeuralPlayground:
    build:
      targets:
        NeuralPlayground: all
    run:
      config: Debug
    archive:
      config: Release
  NPDongle:
    build:
      targets:
        NPDongle: all
        NPDongleWidgets: all
    run:
      config: Debug
    archive:
      config: Release
